name: Agent Review (reusable)

# Reusable form of the sandboxed agent PR review (design spike). A caller
# repository keeps its own triggers, permissions, environment, secret, label
# and event policy, and calls this workflow pinned by commit SHA.
#
# Trust boundaries, one job each (unchanged from the in-repository version):
#   authorize  permission checks only; pins the PR head sha; validates inputs.
#   prepare    downloads the pinned harness, without secrets; runs none of
#              its code.
#   review     two AWF sandbox runs: a keyless one fetches the PR, then the
#              agent runs with no network access but the API proxy. The key
#              is in ONE step's env and reaches only AWF's API-proxy sidecar.
#              The host is treated as tainted once 'awf' returns.
#   publish    fresh VM with a write token; validates the result and posts it.
#
# Two trusted sources, fetched separately and never from the PR:
#   - this workflow's own files (driver, adapters, AWF config, prompt), from
#     'job.workflow_repository' at 'job.workflow_sha': the commit the caller
#     pinned in 'uses:', so scripts and workflow always come from one commit;
#   - the caller's repository-specific prompt addendum, from the caller
#     repository at the caller's 'github.workflow_sha' (the default branch
#     under 'pull_request_target'; the dispatched ref under
#     'workflow_dispatch', which the environment's branch rule gates).

on:
  workflow_call:
    inputs:
      harness:
        description: "Harness: 'opencode', 'pi' or 'stub' (validated against the adapters of this commit)"
        type: string
        required: true
      model:
        description: Model id (not used by 'stub')
        type: string
        default: ""
      pr:
        description: Pull request number; used for 'workflow_dispatch' only
        type: string
        default: ""
      dry_run:
        description: Show the comment in the run summary instead of posting it
        type: boolean
        default: false
      label:
        description: Label that requests a review under 'pull_request_target'
        type: string
        default: agent-review
      environment:
        description: Environment of the 'review' job; holds the inference key, restricted to the default branch
        type: string
        default: agent-review
      project_name:
        description: "Project name used in the prompt (default: the repository name)"
        type: string
        default: ""
      rule_files:
        description: Newline-separated repository paths the agent must follow as rules, in order; each is reset to the PR's base version
        type: string
        default: AGENTS.md
      instruction_files:
        description: Extra newline-separated patterns of files reset to the base version (same syntax as instruction-files.txt)
        type: string
        default: ""
      prompt_addendum:
        description: Path of a Markdown file in the caller repository, read at the caller's workflow commit, appended to the prompt's rules
        type: string
        default: ""
      api_base:
        description: OpenAI-compatible endpoint
        type: string
        default: https://api.inference.cscs.ch/v1
      requests_per_hour:
        description: Upstream requests per run (central ceiling 100)
        type: number
        default: 100
      requests_per_minute:
        description: Upstream requests per minute (central ceiling 30)
        type: number
        default: 30
      max_turns:
        description: AWF maxTurns (central ceiling 80)
        type: number
        default: 80
      harness_timeout_minutes:
        description: Harness time limit (central ceiling 20)
        type: number
        default: 20
      upload_audit:
        description: Upload AWF's audit and proxy logs as an artifact
        type: boolean
        default: false
    secrets:
      inference_api_key:
        description: The dedicated inference key; map it from the caller's environment secret
        required: false
    outputs:
      result:
        description: "posted, dry-run, skipped, missing or invalid ('' if not authorized)"
        value: ${{ jobs.publish.outputs.result }}
      comment_url:
        description: URL of the posted comment
        value: ${{ jobs.publish.outputs.comment_url }}
      head_sha:
        description: The reviewed commit
        value: ${{ jobs.authorize.outputs.head_sha }}

permissions: {}

jobs:
  authorize:
    if: >-
      github.event_name != 'pull_request_target'
      || (
        github.event.sender.type != 'Bot'
        && github.event.pull_request.user.type != 'Bot'
        && (
          (github.event.action == 'labeled' && github.event.label.name == inputs.label)
          || (github.event.action != 'labeled' && github.event.pull_request.draft == false)
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      allowed: ${{ steps.auth.outputs.allowed }}
      pr: ${{ steps.auth.outputs.pr }}
      head_sha: ${{ steps.auth.outputs.head_sha }}
      base_sha: ${{ steps.auth.outputs.base_sha }}
      harness: ${{ steps.auth.outputs.harness }}
      model: ${{ steps.auth.outputs.model }}
      dry_run: ${{ steps.auth.outputs.dry_run }}
      project: ${{ steps.auth.outputs.project }}
      trusted_repo: ${{ steps.auth.outputs.trusted_repo }}
      trusted_sha: ${{ steps.auth.outputs.trusted_sha }}
    steps:
      - name: Authorize
        id: auth
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          SENDER: ${{ github.event.sender.login }}
          ACTOR: ${{ github.actor }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          IN_PR: ${{ inputs.pr }}
          IN_HARNESS: ${{ inputs.harness }}
          IN_MODEL: ${{ inputs.model }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
          IN_PROJECT: ${{ inputs.project_name }}
          IN_RULES: ${{ inputs.rule_files }}
          IN_PATTERNS: ${{ inputs.instruction_files }}
          IN_ADDENDUM: ${{ inputs.prompt_addendum }}
          IN_API_BASE: ${{ inputs.api_base }}
          IN_RPH: ${{ inputs.requests_per_hour }}
          IN_RPM: ${{ inputs.requests_per_minute }}
          IN_TURNS: ${{ inputs.max_turns }}
          IN_TIMEOUT: ${{ inputs.harness_timeout_minutes }}
          IN_ENVIRONMENT: ${{ inputs.environment }}
          TRUSTED_REPO: ${{ job.workflow_repository }}
          TRUSTED_SHA: ${{ job.workflow_sha }}
          CALLER_WF_SHA: ${{ github.workflow_sha }}
        run: |
          fail() {
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "::error::$1"
            exit 1
          }
          resolve_pr() {
            [[ "$1" =~ ^[1-9][0-9]{0,9}$ ]] || fail "Invalid pull request number '$1'."
            if ! shas=$(gh api "repos/${REPO}/pulls/$1" --jq '[.head.sha, .base.sha] | @tsv' 2>&1); then
              fail "Could not resolve pull request #$1: '${shas}'."
            fi
            read -r head_sha base_sha <<< "${shas}"
          }
          # Inputs come from the caller's workflow file: the default branch
          # under 'pull_request_target', any ref a writer dispatches from
          # otherwise. Each value becomes a path, an argument or prompt text.
          int_in() { # name value max
            [[ "$2" =~ ^[1-9][0-9]{0,3}$ ]] && [ "$2" -le "$3" ] || fail "Input $1 must be an integer in 1..$3, got '$2'."
          }
          check_paths() { # name list allow-glob
            local line re='^[A-Za-z0-9_.][A-Za-z0-9_./-]{0,199}$'
            [ "$3" = glob ] && re='^[A-Za-z0-9_.*][A-Za-z0-9_.*/-]{0,199}$'
            while IFS= read -r line; do
              line=${line#"${line%%[![:space:]]*}"}; line=${line%"${line##*[![:space:]]}"}
              case "${line}" in '' | '#'*) continue ;; esac
              [[ "${line}" =~ ${re} ]] || fail "Invalid entry in $1: '${line}'."
              case "/${line}/" in */../* | */./* | *//*) fail "Invalid entry in $1: '${line}'." ;; esac
            done <<< "$2"
          }

          # The workflow's own commit, from which every trusted file is read.
          [[ "${TRUSTED_REPO}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || fail "No job.workflow_repository ('${TRUSTED_REPO}')."
          [[ "${TRUSTED_SHA}" =~ ^[0-9a-f]{40}$ ]] || fail "No job.workflow_sha ('${TRUSTED_SHA}')."
          echo "::notice::Agent review workflow ${TRUSTED_REPO}@${TRUSTED_SHA}; caller ${REPO}@${CALLER_WF_SHA}."

          dry_run=${IN_DRY_RUN}
          case "${EVENT}" in
            pull_request_target)
              pr=${EVENT_PR}
              head_sha=${EVENT_HEAD_SHA}
              base_sha=${EVENT_BASE_SHA}
              if [ "${ACTION}" = labeled ]; then actor=${SENDER}; else actor=${AUTHOR}; fi
              ;;
            workflow_dispatch)
              pr=${IN_PR}
              resolve_pr "${pr}"
              actor=${ACTOR}
              ;;
            pull_request)
              # Self-test only (the central repository's CI): no key, no
              # comment. The PR reviews itself.
              [ "${IN_HARNESS}" = stub ] || fail "The 'pull_request' event is for self-tests with the 'stub' harness only."
              pr=${EVENT_PR}
              head_sha=${EVENT_HEAD_SHA}
              base_sha=${EVENT_BASE_SHA}
              actor=${ACTOR}
              dry_run=true
              ;;
            *) fail "Unexpected event '${EVENT}'." ;;
          esac

          if ! level=$(gh api "repos/${REPO}/collaborators/${actor}/permission" --jq '.permission' 2>&1); then
            fail "Could not resolve repository permission for '${actor}', denying: '${level}'."
          fi
          case "${level}" in
            admin | write) echo "::notice::${actor} has '${level}' permission; running the agent review." ;;
            *)
              echo "::notice::${actor} has '${level}' permission; skipping the agent review."
              echo "allowed=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          [[ "${head_sha}" =~ ^[0-9a-f]{40}$ ]] || fail "Invalid head sha '${head_sha}'."
          [[ "${base_sha}" =~ ^[0-9a-f]{40}$ ]] || fail "Invalid base sha '${base_sha}'."
          harness=${IN_HARNESS}
          [[ "${harness}" =~ ^[a-z][a-z0-9-]{0,31}$ ]] || fail "Invalid harness '${harness}'."
          if [ "${harness}" = stub ]; then
            model=none
          else
            model=${IN_MODEL}
            [ -n "${model}" ] || fail "No model given for harness '${harness}'."
            [[ "${model}" =~ ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$ ]] || fail "Invalid model id '${model}'."
          fi
          case "${dry_run}" in true | false) ;; *) fail "Invalid dry-run flag '${dry_run}'." ;; esac
          project=${IN_PROJECT:-${REPO#*/}}
          [[ "${project}" =~ ^[A-Za-z0-9][A-Za-z0-9._\ -]{0,63}$ ]] || fail "Invalid project name '${project}'."
          check_paths rule_files "${IN_RULES}" plain
          check_paths instruction_files "${IN_PATTERNS}" glob
          [ -z "${IN_ADDENDUM}" ] || check_paths prompt_addendum "${IN_ADDENDUM}" plain
          [ "$(grep -c . <<< "${IN_ADDENDUM}")" -le 1 ] || fail "prompt_addendum takes one path."
          [[ "${IN_API_BASE}" =~ ^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?(/[A-Za-z0-9._/-]*)?$ ]] || fail "Invalid api_base '${IN_API_BASE}'."
          [[ "${IN_ENVIRONMENT}" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$ ]] || fail "Invalid environment '${IN_ENVIRONMENT}'."
          # Central ceilings: a caller can lower the caps, never raise them.
          int_in requests_per_hour "${IN_RPH}" 100
          int_in requests_per_minute "${IN_RPM}" 30
          int_in max_turns "${IN_TURNS}" 80
          int_in harness_timeout_minutes "${IN_TIMEOUT}" 20

          {
            echo "allowed=true"
            echo "pr=${pr}"
            echo "head_sha=${head_sha}"
            echo "base_sha=${base_sha}"
            echo "harness=${harness}"
            echo "model=${model}"
            echo "dry_run=${dry_run}"
            echo "project=${project}"
            echo "trusted_repo=${TRUSTED_REPO}"
            echo "trusted_sha=${TRUSTED_SHA}"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Reviewing #${pr} at ${head_sha} with harness '${harness}', model '${model}'."

  prepare:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.install.outputs.version }}
    steps:
      # The commit is taken from 'authorize', and checked against this job's
      # own 'job.workflow_sha': every job of one call runs the same commit.
      - &fetch-trusted
        name: Fetch trusted files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ needs.authorize.outputs.trusted_repo }}
          SHA: ${{ needs.authorize.outputs.trusted_sha }}
          OWN_REPO: ${{ job.workflow_repository }}
          OWN_SHA: ${{ job.workflow_sha }}
        run: |
          [ "${REPO}" = "${OWN_REPO}" ] && [ "${SHA}" = "${OWN_SHA}" ] ||
            { echo "::error::Workflow commit changed between jobs: '${REPO}@${SHA}' vs '${OWN_REPO}@${OWN_SHA}'."; exit 1; }
          mkdir -p "${RUNNER_TEMP}/trusted"
          gh api "repos/${REPO}/tarball/${SHA}" > "${RUNNER_TEMP}/trusted.tar.gz"
          tar -xzf "${RUNNER_TEMP}/trusted.tar.gz" -C "${RUNNER_TEMP}/trusted" \
            --strip-components=3 --wildcards '*/.github/agent-review/*'
          rm "${RUNNER_TEMP}/trusted.tar.gz"
          echo "::notice::Agent review files from ${REPO}@${SHA}."

      - name: Install the harness
        id: install
        env:
          HARNESS: ${{ needs.authorize.outputs.harness }}
        run: |
          adapter="${RUNNER_TEMP}/trusted/harnesses/${HARNESS}"
          [ -f "${adapter}/install.sh" ] || { echo "::error::No adapter for harness '${HARNESS}'."; exit 1; }
          prefix="${RUNNER_TEMP}/harness"
          bash "${adapter}/install.sh" "${prefix}"
          version=$(head -n 1 "${prefix}/VERSION")
          [[ "${version}" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]{0,63}$ ]] || { echo "::error::Invalid harness version '${version}'."; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          tar -C "${prefix}" -cf "${RUNNER_TEMP}/harness.tar" .

      - name: Upload the harness
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-review-harness
          path: ${{ runner.temp }}/harness.tar
          if-no-files-found: error
          retention-days: 1

  review:
    needs: [authorize, prepare]
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-24.04
    # The CALLER's environment. Restrict it to the default branch: its branch
    # rule is evaluated against the caller run's ref.
    environment: ${{ inputs.environment }}
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    outputs:
      fetch_outcome: ${{ steps.fetch.outcome }}
      outcome: ${{ steps.agent.outcome }}
      exit_code: ${{ steps.agent.outputs.exit_code }}
      skipped: ${{ steps.key.outputs.skipped }}
    env:
      WS: ${{ github.workspace }}/agent-review
      HARNESS: ${{ needs.authorize.outputs.harness }}
    steps:
      - *fetch-trusted

      # Caller configuration: validated inputs, and the addendum from the
      # caller repository at the caller's workflow commit (never the PR).
      - name: Fetch the caller configuration
        env:
          GH_TOKEN: ${{ github.token }}
          CALLER_REPO: ${{ github.repository }}
          CALLER_SHA: ${{ github.workflow_sha }}
          RULES: ${{ inputs.rule_files }}
          PATTERNS: ${{ inputs.instruction_files }}
          ADDENDUM: ${{ inputs.prompt_addendum }}
        run: |
          cfg="${RUNNER_TEMP}/trusted/config"
          mkdir -p "${cfg}"
          printf '%s\n' "${RULES}" > "${cfg}/rule-files.txt"
          printf '%s\n' "${PATTERNS}" > "${cfg}/extra-instruction-files.txt"
          : > "${cfg}/prompt-addendum.md"
          if [ -n "${ADDENDUM}" ]; then
            gh api -H 'Accept: application/vnd.github.raw' \
              "repos/${CALLER_REPO}/contents/${ADDENDUM}?ref=${CALLER_SHA}" > "${cfg}/prompt-addendum.md"
            echo "::notice::Prompt addendum ${ADDENDUM} from ${CALLER_REPO}@${CALLER_SHA}."
          fi

      - name: Prepare the sandbox inputs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.authorize.outputs.pr }}
          HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
          BASE_SHA: ${{ needs.authorize.outputs.base_sha }}
          MODEL: ${{ needs.authorize.outputs.model }}
          PROJECT: ${{ needs.authorize.outputs.project }}
          TIMEOUT: ${{ inputs.harness_timeout_minutes }}
        run: |
          sudo rm -rf /opt/agent-review
          sudo mkdir -p /opt/agent-review
          sudo cp -R "${RUNNER_TEMP}/trusted/." /opt/agent-review/
          mkdir -p "${WS}/in"
          gh api "repos/${REPO}/pulls/${PR}" > "${WS}/in/pr.json"
          jq -n \
            --arg repo "${REPO}" --arg pr "${PR}" --arg head_sha "${HEAD_SHA}" \
            --arg base_sha "${BASE_SHA}" --arg harness "${HARNESS}" --arg model "${MODEL}" \
            --arg project "${PROJECT}" --argjson timeout "${TIMEOUT}" \
            '{repo: $repo, pr: $pr, head_sha: $head_sha, base_sha: $base_sha,
              harness: $harness, model: $model, harness_timeout_minutes: $timeout,
              project: $project, stub_padding_kib: 0}' > "${WS}/in/params.json"

      - name: Download the harness
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-review-harness
          path: ${{ runner.temp }}/harness-artifact

      - name: Unpack the harness
        run: |
          sudo mkdir -p "/opt/agent-review/harness/${HARNESS}"
          sudo tar -xf "${RUNNER_TEMP}/harness-artifact/harness.tar" --no-same-owner --no-same-permissions \
            -C "/opt/agent-review/harness/${HARNESS}"
          sudo chown -R root:root /opt/agent-review
          sudo chmod -R a+rX,go-w /opt/agent-review

      - name: Set up AWF
        id: awf
        uses: github/gh-aw-firewall@7dc485464a58130d6ac2e73fe632424eb5d06823 # v0.29.12
        with:
          version: v0.29.12
          pull-images: "true"

      - name: Render the AWF configuration
        env:
          MODEL: ${{ needs.authorize.outputs.model }}
          RPH: ${{ inputs.requests_per_hour }}
          RPM: ${{ inputs.requests_per_minute }}
          TURNS: ${{ inputs.max_turns }}
          TIMEOUT: ${{ inputs.harness_timeout_minutes }}
        run: |
          set -o pipefail
          yq -o=json '.' /opt/agent-review/awf.yaml \
            | jq --arg model "${MODEL}" --arg ws "${WS}" \
              --argjson rph "${RPH}" --argjson rpm "${RPM}" --argjson turns "${TURNS}" --argjson timeout "${TIMEOUT}" \
              '.apiProxy.allowedModels = ["openai/" + $model] | .filesystem.allowWrite = [$ws]
               | .rateLimiting.requestsPerHour = $rph | .rateLimiting.requestsPerMinute = $rpm
               | .apiProxy.maxTurns = $turns | .container.agentTimeout = ($timeout + 5)' \
            > "${RUNNER_TEMP}/awf.json"
          jq '.network.allowDomains = ["github.com"] | .container.agentTimeout = 10' \
            "${RUNNER_TEMP}/awf.json" > "${RUNNER_TEMP}/awf-fetch.json"
          sudo install -d -m 0700 "${RUNNER_TEMP}/awf-fetch-audit" "${RUNNER_TEMP}/awf-fetch-logs" \
            "${RUNNER_TEMP}/awf-audit" "${RUNNER_TEMP}/awf-logs"
          mkdir -p /tmp/gh-aw/sandbox/firewall/audit /tmp/gh-aw/sandbox/firewall/logs /tmp/gh-aw/mcp-logs
          echo "AWF_BIN=$(command -v awf)" >> "$GITHUB_ENV"

      - name: Check the inference key
        id: key
        env:
          HAS_KEY: ${{ secrets.inference_api_key != '' }}
        run: |
          wire=$(head -n 1 "/opt/agent-review/harnesses/${HARNESS}/wire")
          case "${wire}" in
            openai-chat)
              if [ "${HAS_KEY}" != true ]; then
                echo "::notice::No inference key was passed (secret 'inference_api_key'); skipping the review."
                echo "skipped=true" >> "$GITHUB_OUTPUT"
              fi
              ;;
            none) ;;
            *) echo "::error::Unsupported wire '${wire}' for harness '${HARNESS}'."; exit 1 ;;
          esac

      - name: Fetch the pull request in the sandbox
        id: fetch
        if: steps.key.outputs.skipped != 'true'
        continue-on-error: true
        timeout-minutes: 12
        env:
          AGENT_REVIEW_OPENAI_BASE_URL: ${{ inputs.api_base }}
          IMAGE_TAG: ${{ steps.awf.outputs.image-tag }}
        run: |
          sudo -E "${AWF_BIN}" \
            --config "${RUNNER_TEMP}/awf-fetch.json" \
            --audit-dir "${RUNNER_TEMP}/awf-fetch-audit" \
            --proxy-logs-dir "${RUNNER_TEMP}/awf-fetch-logs" \
            --image-tag "${IMAGE_TAG}" \
            --container-workdir "${WS}" \
            -- /opt/agent-review/bin/run-review --phase fetch "${WS}" 2>&1 \
            | /usr/bin/sed -u -e 's/\r//g' -e 's/^/awf| /'
          exit "${PIPESTATUS[0]}"

      - name: Run the review in the sandbox
        id: agent
        if: steps.key.outputs.skipped != 'true' && steps.fetch.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 30
        env:
          KEY: ${{ secrets.inference_api_key }}
          AGENT_REVIEW_OPENAI_BASE_URL: ${{ inputs.api_base }}
          IMAGE_TAG: ${{ steps.awf.outputs.image-tag }}
        run: |
          if [ "$(head -n 1 "/opt/agent-review/harnesses/${HARNESS}/wire")" = openai-chat ]; then
            export OPENAI_API_KEY="${KEY}"
          fi
          unset KEY
          set +e
          sudo -E "${AWF_BIN}" \
            --config "${RUNNER_TEMP}/awf.json" \
            --audit-dir "${RUNNER_TEMP}/awf-audit" \
            --proxy-logs-dir "${RUNNER_TEMP}/awf-logs" \
            --image-tag "${IMAGE_TAG}" \
            --container-workdir "${WS}" \
            -- /opt/agent-review/bin/run-review --phase review "${WS}" 2>&1 \
            | /usr/bin/sed -u -e 's/\r//g' -e 's/^/awf| /'
          rc=${PIPESTATUS[0]}
          echo "exit_code=${rc}" >> "$GITHUB_OUTPUT"
          exit "${rc}"

      - name: Stop the sandbox
        id: teardown
        if: always() && steps.key.outputs.skipped != 'true'
        shell: /usr/bin/bash --noprofile --norc -e -o pipefail {0}
        env:
          PATH: /usr/bin:/bin
        run: |
          ids=$(/usr/bin/sudo /usr/bin/docker ps -aq)
          if [ -n "${ids}" ]; then
            echo "Removing $(/usr/bin/wc -l <<< "${ids}") leftover container(s)."
            # shellcheck disable=SC2086 # container ids, one per word
            /usr/bin/sudo /usr/bin/docker rm -f ${ids} > /dev/null
          fi
          if [ -n "$(/usr/bin/sudo /usr/bin/docker ps -aq)" ]; then
            echo "::error::Sandbox containers survived the teardown; not collecting the result."
            exit 1
          fi

      - name: Collect the result
        if: always() && steps.key.outputs.skipped != 'true' && steps.teardown.outcome == 'success'
        shell: /usr/bin/bash --noprofile --norc -e -o pipefail {0}
        env:
          PATH: /usr/bin:/bin
        run: /usr/bin/bash /opt/agent-review/bin/collect-result "${WS}/out" "${RUNNER_TEMP}/result"

      - name: Upload the result
        if: always() && steps.key.outputs.skipped != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-review-result
          path: ${{ runner.temp }}/result
          if-no-files-found: ignore
          retention-days: 7

      - name: Report token usage
        if: always() && steps.key.outputs.skipped != 'true'
        shell: /usr/bin/bash --noprofile --norc -e -o pipefail {0}
        env:
          PATH: /usr/bin:/bin
        run: |
          log="${RUNNER_TEMP}/awf-logs/api-proxy-logs/token-usage.jsonl"
          if ! /usr/bin/sudo /usr/bin/test -f "${log}"; then
            echo "No token usage log."
            exit 0
          fi
          /usr/bin/sudo /usr/bin/cat "${log}" | /usr/bin/jq -rs '
            "| Model calls | Failed calls | Input tokens | Output tokens |",
            "| ---: | ---: | ---: | ---: |",
            "| \(length) | \(map(select((.status | tonumber? // 0) >= 400)) | length)"
            + " | \(map(.input_tokens | numbers) | add // 0) | \(map(.output_tokens | numbers) | add // 0) |"' \
            | /usr/bin/tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Make the AWF audit log readable
        if: always() && steps.key.outputs.skipped != 'true' && inputs.upload_audit
        shell: /usr/bin/bash --noprofile --norc -e -o pipefail {0}
        env:
          PATH: /usr/bin:/bin
        run: |
          /usr/bin/sudo /usr/bin/chmod -R a+rX "${RUNNER_TEMP}/awf-fetch-audit" "${RUNNER_TEMP}/awf-fetch-logs" \
            "${RUNNER_TEMP}/awf-audit" "${RUNNER_TEMP}/awf-logs"

      - name: Upload the AWF audit log
        if: always() && steps.key.outputs.skipped != 'true' && inputs.upload_audit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-review-audit
          path: |
            ${{ runner.temp }}/awf-fetch-audit
            ${{ runner.temp }}/awf-fetch-logs
            ${{ runner.temp }}/awf-audit
            ${{ runner.temp }}/awf-logs
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: [authorize, prepare, review]
    if: always() && needs.authorize.outputs.allowed == 'true' && needs.review.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    outputs:
      result: ${{ steps.publish.outputs.result || steps.render.outputs.result }}
      comment_url: ${{ steps.publish.outputs.comment_url }}
    steps:
      - *fetch-trusted

      - name: Download the result
        id: download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-review-result
          path: ${{ runner.temp }}/result

      - name: Render the review
        id: render
        env:
          HARNESS: ${{ needs.authorize.outputs.harness }}
          MODEL: ${{ needs.authorize.outputs.model }}
          HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
          DRY_RUN: ${{ needs.authorize.outputs.dry_run }}
          SKIPPED: ${{ needs.review.outputs.skipped }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          pc="${RUNNER_TEMP}/trusted/bin/publish-comment"
          review="${RUNNER_TEMP}/result/review.md"
          if [ "${SKIPPED}" = true ]; then
            echo "result=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f "${review}" ]; then
            echo "result=missing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rc=0
          bash "${pc}" render --harness "${HARNESS}" --version "${VERSION}" --model "${MODEL}" \
            --head-sha "${HEAD_SHA}" --run-url "${RUN_URL}" --review "${review}" > "${RUNNER_TEMP}/body.md" || rc=$?
          case "${rc}" in
            0) ;;
            3) echo "result=invalid" >> "$GITHUB_OUTPUT"; exit 0 ;;
            *) exit "${rc}" ;;
          esac
          if [ "${DRY_RUN}" = true ]; then
            {
              echo "### Agent review (dry run, not posted)"
              echo
              cat "${RUNNER_TEMP}/body.md"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "result=dry-run" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "result=rendered" >> "$GITHUB_OUTPUT"

      - name: Publish the review
        id: publish
        if: steps.render.outputs.result == 'rendered'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.authorize.outputs.pr }}
          HARNESS: ${{ needs.authorize.outputs.harness }}
        run: |
          url=$(bash "${RUNNER_TEMP}/trusted/bin/publish-comment" post --repo "${REPO}" --pr "${PR}" \
            --harness "${HARNESS}" --body-file "${RUNNER_TEMP}/body.md")
          echo "::notice::Posted the agent review: ${url}"
          { echo "result=posted"; echo "comment_url=${url}"; } >> "$GITHUB_OUTPUT"

      - name: Report a missing review
        if: steps.render.outputs.result == 'missing' || steps.render.outputs.result == 'invalid'
        env:
          RESULT: ${{ steps.render.outputs.result }}
          FETCH_OUTCOME: ${{ needs.review.outputs.fetch_outcome }}
          OUTCOME: ${{ needs.review.outputs.outcome }}
          EXIT_CODE: ${{ needs.review.outputs.exit_code }}
        run: |
          case "${RESULT}" in
            missing) reason="the agent produced no review (fetch outcome '${FETCH_OUTCOME}', review outcome '${OUTCOME}', exit code '${EXIT_CODE}')" ;;
            invalid) reason="the review was rejected as invalid (not UTF-8, or empty)" ;;
          esac
          echo "::warning title=Agent review failed::No review was posted: ${reason}."
